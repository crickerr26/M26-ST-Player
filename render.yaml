# Render Blueprint. Must live at the repo root for the one-click deploy link to work;
# rootDir points it at the relay service itself. See relay/README.md.
services:
  - type: web
    name: m26-stalker-relay
    runtime: node
    plan: free
    rootDir: relay
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
